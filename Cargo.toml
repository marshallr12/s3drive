[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/s3drive-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/marshallr12/s3drive"

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
rustls-platform-verifier = "=0.7.1"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["tls12"] }
hyper = { version = "=1.12.0", default-features = false, features = ["server", "client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "service", "client-legacy"] }
zeroize = "=1.9.1"
tower-layer = "=0.3.3"
tower-service = "=0.3.3"
rcgen = { version = "=0.14.9", default-features = false, features = ["aws_lc_rs", "pem"] }
serde_json = "=1.0.151"
aws-config = "1.12.0"
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["default-https-client", "rt-tokio", "rustls"] }
aws-credential-types = "1.3.0"
clap = { version = "4.6.7", features = ["derive"] }
fuser = "0.18.0"
getrandom = "0.4.3"
nix = { version = "0.31.3", features = ["user"] }
percent-encoding = "2.3.2"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup", "hooks", "limits", "cache"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = "1.1.8"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "net"] }
url = "2.5.8"
unicode-normalization = "=0.1.25"
winfsp = { version = "0.13.1", default-features = false, features = ["system", "delayload"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Wdk_System_SystemServices"] }
s3drive-authority = { path = "crates/s3drive-authority" }
s3drive-managed = { path = "crates/s3drive-managed" }
s3drive-core = { path = "crates/s3drive-core" }
s3drive-fs = { path = "crates/s3drive-fs" }
s3drive-s3 = { path = "crates/s3drive-s3" }
s3drive-state = { path = "crates/s3drive-state" }
s3drive-fuse = { path = "crates/s3drive-fuse" }
s3drive-winfsp = { path = "crates/s3drive-winfsp" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# The generated S3 SDK is large; symbols are unnecessary for the normal gate.
[profile.dev]
debug = 0
