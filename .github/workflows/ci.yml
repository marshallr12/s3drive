name: CI

on:
  push:
  pull_request:

env:
  RUST_TEST_THREADS: "4"
  CARGO_BUILD_JOBS: "4"

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore Rust build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}-
            rust-${{ runner.os }}-1.99.1-
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - name: Install pinned WinFsp runtime and SDK
        if: runner.os == 'Windows'
        run: ./scripts/install-winfsp.ps1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify workspace-unified lineage on the default test stack
        timeout-minutes: 5
        run: cargo test --workspace --locked mixed_publication_lineage_repeats_after_restart_recovers_exact_reply_and_refuses_foreign_root -- --exact --nocapture --test-threads=1
      - name: Verify shared runtime reader-release admission at retained capacity
        timeout-minutes: 18
        run: cargo test -p s3drive-fs native_retention_runtime --locked -- --nocapture --test-threads=1
      - name: Verify fresh linked-native retry retirement and terminal proof integrity
        run: cargo test -p s3drive-state native_retry --locked -- --nocapture --test-threads=4
      - name: Verify retry fencing checkpoints rollback and killed owners
        run: cargo test -p s3drive-state retry_safety --locked -- --nocapture --test-threads=4
      - name: Verify historical upgrade row and schema preservation
        run: cargo test -p s3drive-state upgrade --locked -- --nocapture --test-threads=4
      - name: Verify transactional local retirement bounds corruption rollback and killed owners
        run: cargo test -p s3drive-state retention_ --locked -- --nocapture --test-threads=4
      - name: Verify scoped SDK populated migration and local retention
        run: cargo test -p s3drive-cli --test chunk_publication local_retention_sdk --locked -- --nocapture --test-threads=1
      - name: Verify physical snapshot lifetimes lost replies and killed owners
        run: cargo test -p s3drive-state physical_readers --locked -- --nocapture --test-threads=4
      - name: Verify cold namespace state rollback and killed transactions
        run: cargo test -p s3drive-state namespace_cold --locked -- --nocapture --test-threads=4
      - name: Verify cold namespace SDK exact replay and killed owner
        run: cargo test -p s3drive-cli --test chunk_publication cold_namespace --locked -- --nocapture --test-threads=4
      - name: Verify owned sparse SDK and killed recovery
        run: cargo test -p s3drive-cli --test chunk_publication owned_sparse --locked -- --nocapture --test-threads=4
      - name: Verify transaction-local publication proof batching
        run: cargo test -p s3drive-state publication_batch --locked -- --nocapture
      - name: Verify native sparse atomic admission Close and cold fences
        run: cargo test -p s3drive-state native_sparse --locked -- --nocapture --test-threads=4
      - name: Verify original-open sparse SDK and chunk disposition controller
        run: cargo test -p s3drive-cli --test chunk_publication native_sparse_sdk --locked -- --nocapture --test-threads=4
      - name: Verify bounded native Close join signals
        run: cargo test -p s3drive-fs native_close_join --locked -- --nocapture
      - name: Verify opt-in shared native sparse unlink replacement and Close
        run: cargo test -p s3drive-cli --test chunk_publication native_lifecycle_shared --locked -- --nocapture --test-threads=4
      - name: Verify default legacy version8 profile unchanged
        run: cargo test -p s3drive-cli --test chunk_publication native_chunk_ --locked -- --nocapture --test-threads=4
      - name: Prepare Linux FUSE acceptance
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 tmux libglib2.0-bin
          sudo modprobe fuse
          test -c /dev/fuse
      - name: Verify component cleanup shared lifecycle and cold recovery
        timeout-minutes: 10
        run: cargo test -p s3drive-cli --test chunk_publication component_retention_shared_ --locked -- --nocapture --test-threads=1
      - name: Verify component cleanup actual native lifecycle
        timeout-minutes: 8
        run: cargo test -p s3drive-cli --test chunk_publication component_retention_actual_ --locked -- --ignored --nocapture --test-threads=1
      - name: Verify fresh linked-native shared saves and restart bounds
        timeout-minutes: 20
        run: cargo test -p s3drive-cli --test chunk_publication native_retention_shared_ --locked -- --nocapture --test-threads=1
      - name: Verify fresh linked-native actual saves Close and remount bounds
        timeout-minutes: 20
        run: cargo test -p s3drive-cli --test chunk_publication native_retention_actual_ --locked -- --ignored --nocapture --test-threads=1
      - name: Verify release fresh linked-native actual saves Close and remount bounds
        timeout-minutes: 25
        run: cargo test -p s3drive-cli --test chunk_publication --release native_retention_actual_ --locked -- --ignored --nocapture --test-threads=1
      - name: Verify NEW real native sparse unlink replacement dirty handles and remount
        timeout-minutes: 10
        run: cargo test -p s3drive-cli --test chunk_publication native_lifecycle_actual_ --locked -- --ignored --nocapture --test-threads=1
      - name: Verify release NEW real native sparse lifecycle and syscall timings
        if: runner.os == 'Linux' || runner.os == 'Windows'
        timeout-minutes: 20
        run: cargo test -p s3drive-cli --test chunk_publication --release native_lifecycle_actual_ --locked -- --ignored --nocapture --test-threads=1
      - name: Verify default legacy native mounts without the opt-in
        timeout-minutes: 8
        run: cargo test -p s3drive-cli --test chunk_publication actual_native_chunk_writes_unicode_sparse_flush_resize_and_remount --locked -- --ignored --nocapture --exact --test-threads=1
      - name: Verify typed owned sparse state and crash recovery
        run: cargo test -p s3drive-state owned_sparse --locked -- --test-threads=4
      - name: Verify Windows callback stack bound
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: cargo test -p s3drive-cli --test chunk_publication native_chunk_callbacks_use_owned_runtime_tasks_on_a_small_driver_stack --locked -- --nocapture --exact
      - name: Verify Windows native immutable chunk writes and remount
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: cargo test -p s3drive-cli --test chunk_publication actual_native_chunk_writes_unicode_sparse_flush_resize_and_remount --locked -- --ignored --nocapture --exact --test-threads=1
      - name: Classify coordinator TLS I/O and exercise fresh CLI connections
        timeout-minutes: 5
        run: cargo test -p s3drive-cli --test authority_restart tls_cli_ --locked -- --nocapture
      - name: Verify Windows metadata body-poll controls
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: cargo test -p s3drive-authority --tests --locked -- --nocapture
      # The preceding real CLI/TLS test already builds this same executable and
      # fixture worker. Exercise snapshots/console in the ordinary account
      # before native lifecycle failures can skip their independent acceptance.
      - name: Verify Windows coordinator startup and recovery
        if: runner.os == 'Windows'
        timeout-minutes: 10
        env:
          S3DRIVE_DISPOSABLE_WINDOWS_VM: '1'
        run: cargo test -p s3drive-cli --test authority_restart supervised_windows_coordinator_tls_independent_logons_and_recovery --locked -- --ignored --nocapture --exact
      - name: Verify Windows metadata flush burst
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: cargo test -p s3drive-cli --test windows_mount actual_managed_metadata_flush_burst --locked -- --ignored --nocapture --exact --test-threads=1
      - name: Verify Windows replacement fixture rejection checks
        if: runner.os == 'Windows'
        run: ./scripts/test-windows-replacement-fixture.ps1
      - name: Verify Windows replacement reference
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: ./scripts/test-windows-replacement-reference.ps1
      - name: Retain Windows replacement observations
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-replacement-reference-${{ github.sha }}
          path: ${{ runner.temp }}/windows-replacement-reference.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify complete Windows disposition lifecycle
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: cargo test -p s3drive-cli --test windows_mount actual_managed_windows_disposition_lifecycle --locked -- --ignored --nocapture --test-threads=1
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: Verify actual schema46/schema47, schema47/schema48, schema48/schema49 and schema49/schema50 compatibility
        if: runner.os == 'Linux'
        run: |
          cp target/debug/s3drive "$RUNNER_TEMP/s3drive-schema50"
          git fetch origin 5343eb41b6132ba3a8a5cfc2f74b4d6ff01d0b28 82c46803560773b90e405c935e1f6846616c5d7b 86d1e0ea7e27889e418863e3ab1b58e6e629f56c ad4d966e9ccf37aeed0d5cab6cdb77366ca88a5f
          git worktree add --detach "$RUNNER_TEMP/s3drive-schema46-source" 5343eb41b6132ba3a8a5cfc2f74b4d6ff01d0b28
          CARGO_TARGET_DIR="$RUNNER_TEMP/s3drive-compat-target" cargo build --manifest-path "$RUNNER_TEMP/s3drive-schema46-source/Cargo.toml" -p s3drive-cli --locked
          cp "$RUNNER_TEMP/s3drive-compat-target/debug/s3drive" "$RUNNER_TEMP/s3drive-schema46"
          git worktree add --detach "$RUNNER_TEMP/s3drive-schema47-source" 82c46803560773b90e405c935e1f6846616c5d7b
          CARGO_TARGET_DIR="$RUNNER_TEMP/s3drive-compat-target" cargo build --manifest-path "$RUNNER_TEMP/s3drive-schema47-source/Cargo.toml" -p s3drive-cli --locked
          cp "$RUNNER_TEMP/s3drive-compat-target/debug/s3drive" "$RUNNER_TEMP/s3drive-schema47"
          git worktree add --detach "$RUNNER_TEMP/s3drive-schema48-source" 86d1e0ea7e27889e418863e3ab1b58e6e629f56c
          CARGO_TARGET_DIR="$RUNNER_TEMP/s3drive-compat-target" cargo build --manifest-path "$RUNNER_TEMP/s3drive-schema48-source/Cargo.toml" -p s3drive-cli --locked
          cp "$RUNNER_TEMP/s3drive-compat-target/debug/s3drive" "$RUNNER_TEMP/s3drive-schema48"
          git worktree add --detach "$RUNNER_TEMP/s3drive-schema49-source" ad4d966e9ccf37aeed0d5cab6cdb77366ca88a5f
          CARGO_TARGET_DIR="$RUNNER_TEMP/s3drive-compat-target" cargo build --manifest-path "$RUNNER_TEMP/s3drive-schema49-source/Cargo.toml" -p s3drive-cli --locked
          cp "$RUNNER_TEMP/s3drive-compat-target/debug/s3drive" "$RUNNER_TEMP/s3drive-schema49"
          S3DRIVE_COMPAT_NEW_SHA=82c46803560773b90e405c935e1f6846616c5d7b python3 scripts/test-owned-sparse-compatibility.py "$RUNNER_TEMP/s3drive-schema46" "$RUNNER_TEMP/s3drive-schema47" "$RUNNER_TEMP/owned-sparse-compatibility"
          S3DRIVE_COMPAT_OLD_SCHEMA=47 S3DRIVE_COMPAT_NEW_SCHEMA=48 S3DRIVE_COMPAT_NEW_SHA=86d1e0ea7e27889e418863e3ab1b58e6e629f56c S3DRIVE_COMPAT_OLD_SHA=82c46803560773b90e405c935e1f6846616c5d7b python3 scripts/test-owned-sparse-compatibility.py "$RUNNER_TEMP/s3drive-schema47" "$RUNNER_TEMP/s3drive-schema48" "$RUNNER_TEMP/native-sparse-close-compatibility"
          S3DRIVE_COMPAT_NEW_SHA=ad4d966e9ccf37aeed0d5cab6cdb77366ca88a5f S3DRIVE_COMPAT_OLD_SCHEMA=48 S3DRIVE_COMPAT_NEW_SCHEMA=49 S3DRIVE_COMPAT_OLD_SHA=86d1e0ea7e27889e418863e3ab1b58e6e629f56c python3 scripts/test-owned-sparse-compatibility.py "$RUNNER_TEMP/s3drive-schema48" "$RUNNER_TEMP/s3drive-schema49" "$RUNNER_TEMP/retry-checkpoint-compatibility"
          S3DRIVE_COMPAT_OLD_SCHEMA=49 S3DRIVE_COMPAT_NEW_SCHEMA=50 S3DRIVE_COMPAT_OLD_SHA=ad4d966e9ccf37aeed0d5cab6cdb77366ca88a5f python3 scripts/test-owned-sparse-compatibility.py "$RUNNER_TEMP/s3drive-schema49" "$RUNNER_TEMP/s3drive-schema50" "$RUNNER_TEMP/local-retention-compatibility"
          S3DRIVE_RETENTION_OLD_BINARY="$RUNNER_TEMP/s3drive-schema49" cargo test -p s3drive-state retention_actual_old_binary_refuses_reclaimed_store --locked -- --nocapture
          cmp target/debug/s3drive "$RUNNER_TEMP/s3drive-schema50"
      - name: Retain schema compatibility observations
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owned-sparse-schema-compatibility-${{ github.sha }}
          path: ${{ runner.temp }}/owned-sparse-compatibility/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain native sparse schema compatibility observations
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-sparse-close-schema-compatibility-${{ github.sha }}
          path: ${{ runner.temp }}/native-sparse-close-compatibility/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain retry checkpoint schema compatibility observations
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retry-checkpoint-schema-compatibility-${{ github.sha }}
          path: ${{ runner.temp }}/retry-checkpoint-compatibility/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain local retirement schema compatibility observations
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-retention-schema-compatibility-${{ github.sha }}
          path: ${{ runner.temp }}/local-retention-compatibility/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify Windows supervisor retry policy
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: ./scripts/test-windows-supervisor-policy.ps1
      - name: Verify paired Windows managed startup and recovery
        if: runner.os == 'Windows'
        timeout-minutes: 16
        env:
          S3DRIVE_DISPOSABLE_WINDOWS_VM: '1'
        run: cargo test -p s3drive-cli --test authority_restart supervised_windows_managed_drive_and_coordinator_recovery --locked -- --ignored --nocapture --exact
      # Native cases share process-wide descriptors and driver/Shell state.
      # A fork in another case can close a live FUSE descriptor and flush it.
      - name: Verify Windows reference fixture rejection checks
        if: runner.os == 'Windows'
        run: ./scripts/test-windows-reference-fixture.ps1
      - name: Verify Windows deletion reference contract
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: ./scripts/test-windows-disposition-reference.ps1
      - name: Retain Windows reference observations
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-disposition-reference-${{ github.sha }}
          path: ${{ runner.temp }}/windows-disposition-reference.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify real Linux mount and teardown
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: cargo test -p s3drive-cli --test linux_mount --locked -- --ignored --nocapture --test-threads=1
      - name: Verify real Windows drive and teardown
        if: runner.os == 'Windows'
        timeout-minutes: 10
        env:
          # GitHub destroys this fresh VM after the job. Only a retained Windows
          # fixture-profile sharing violation may defer to that disposal.
          S3DRIVE_DISPOSABLE_WINDOWS_VM: '1'
        # Both skipped cases already run explicitly above on this same source.
        run: cargo test -p s3drive-cli --test windows_mount --locked -- --ignored --nocapture --test-threads=1 --skip actual_managed_windows_disposition_lifecycle --skip actual_managed_metadata_flush_burst
      - name: Verify native manifest ranges and remount
        timeout-minutes: 5
        run: cargo test -p s3drive-cli --test chunk_reader native::actual_native_manifest_reads_and_remount --locked -- --ignored --nocapture --exact
      - name: Verify Linux native immutable chunk writes and remount
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: cargo test -p s3drive-cli --test chunk_publication actual_native_chunk_writes_unicode_sparse_flush_resize_and_remount --locked -- --ignored --nocapture --exact --test-threads=1
      - name: Verify Linux startup without systemd
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: python3 scripts/test-linux-session.py
      - name: Verify Linux coordinator startup without systemd
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: cargo test -p s3drive-cli --test authority_restart supervised_linux_coordinator_http_and_tls_with_private_ca --locked -- --ignored --nocapture
      - name: Save Rust build cache
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
  native-validation-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore Rust build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-diagnostics-${{ github.sha }}
          restore-keys: |
            rust-Linux-1.99.1-${{ hashFiles('Cargo.lock') }}-
            rust-Linux-1.99.1-
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Measure bounded native protocol validation work
        timeout-minutes: 5
        run: cargo test -p s3drive-state native_retry_validation_work --locked -- --nocapture --test-threads=1
      - name: Verify component admission reader survives concurrent prior Close
        timeout-minutes: 5
        run: cargo test -p s3drive-fs native_retention_runtime_component_admission_lease_survives_prior_close --locked -- --nocapture --test-threads=1
      - name: Diagnose component shared lifecycle and cold recovery
        timeout-minutes: 10
        run: cargo test -p s3drive-cli --test chunk_publication component_retention_shared_ --locked -- --nocapture --test-threads=1
      - name: Measure actual shared filesystem dirty-save phases
        timeout-minutes: 5
        run: |
          getconf CLK_TCK
          cargo test -p s3drive-cli --test chunk_publication native_retention_validation_work_shared_phases --locked -- --exact --nocapture --test-threads=1
  native-phase-diagnostics:
    # Separate measurement only; original 300-save acceptance is unchanged.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore Rust build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-phases-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}-
            rust-${{ runner.os }}-1.99.1-
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install pinned WinFsp runtime and SDK
        if: runner.os == 'Windows'
        run: ./scripts/install-winfsp.ps1
      - name: Prepare Linux FUSE measurement
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo modprobe fuse
          test -c /dev/fuse
          getconf CLK_TCK
      - name: Verify standalone state proof hashing without workspace feature unification
        timeout-minutes: 5
        run: cargo test -p s3drive-state proof_hash --locked -- --nocapture --test-threads=1
      - name: Build ordinary debug native fixture
        timeout-minutes: 10
        run: cargo test -p s3drive-cli --test chunk_publication --no-run --locked
      - name: Compare exact SHA256 digests and ordinary debug backend cost
        timeout-minutes: 5
        run: cargo test -p s3drive-cli --test sha256_backends sha256_backend_equivalence_and_debug_cost --locked -- --exact --ignored --nocapture --test-threads=1
      - name: Measure actual native syscall phases and owned daemon CPU
        timeout-minutes: 5
        run: cargo test -p s3drive-cli --test chunk_publication native_retention_validation_work_native_phases --locked -- --exact --ignored --nocapture --test-threads=1
      - name: Diagnose component cleanup through actual native callbacks
        timeout-minutes: 8
        run: cargo test -p s3drive-cli --test chunk_publication component_retention_actual_ --locked -- --ignored --nocapture --test-threads=1
  native-cpu-profile:
    # Diagnostic only. Profiler wall time is not native/runtime acceptance.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore Rust build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-cpu-profile-${{ github.sha }}
          restore-keys: |
            rust-Linux-1.99.1-${{ hashFiles('Cargo.lock') }}-
            rust-Linux-1.99.1-
      - name: Install pinned Rust and official Ubuntu profiling tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y valgrind linux-tools-generic
          valgrind --version
          rustc -Vv
          git rev-parse HEAD HEAD^{tree}
          getconf CLK_TCK
      - name: Select permitted profiler without changing host permissions
        run: |
          mkdir -p "$RUNNER_TEMP/native-cpu-profile"
          perf_binary=$(find /usr/lib/linux-tools -type f -name perf -executable | sort | head -n 1)
          if [ -n "$perf_binary" ] && "$perf_binary" record --call-graph dwarf,16384 -F 99 -o "$RUNNER_TEMP/native-cpu-profile/probe.data" -- true; then
            dirname "$perf_binary" >> "$GITHUB_PATH"
            echo "S3DRIVE_NATIVE_PROFILE_TOOL=perf" >> "$GITHUB_ENV"
            echo "S3DRIVE_NATIVE_PROFILE_OUTPUT=$RUNNER_TEMP/native-cpu-profile/perf.data" >> "$GITHUB_ENV"
            "$perf_binary" --version
          else
            echo "Native sampling unavailable under unchanged runner permissions; using instruction-count profiling."
            echo "S3DRIVE_NATIVE_PROFILE_TOOL=callgrind" >> "$GITHUB_ENV"
            echo "S3DRIVE_NATIVE_PROFILE_OUTPUT=$RUNNER_TEMP/native-cpu-profile/callgrind.out" >> "$GITHUB_ENV"
          fi
      - name: Build exact ordinary debug-info filesystem fixture
        timeout-minutes: 10
        run: cargo test -p s3drive-cli --test chunk_publication --locked --no-run
      - name: Run unprofiled identical-binary three-save baseline
        timeout-minutes: 3
        env:
          S3DRIVE_NATIVE_PROFILE_TOOL: none
        run: cargo test -p s3drive-cli --test chunk_publication native_retention_cpu_profile_post_anchor_saves --locked -- --exact --nocapture --test-threads=1
      - name: Profile actual child for two post-anchor saves
        timeout-minutes: 17
        run: cargo test -p s3drive-cli --test chunk_publication native_retention_cpu_profile_post_anchor_saves --locked -- --exact --nocapture --test-threads=1
      - name: Report symbolic CPU costs without publishing raw profile archives
        if: always()
        run: |
          if [ "$S3DRIVE_NATIVE_PROFILE_TOOL" = perf ] && [ -f "$S3DRIVE_NATIVE_PROFILE_OUTPUT" ]; then
            perf report --stdio --sort symbol,dso --percent-limit 1 --input "$S3DRIVE_NATIVE_PROFILE_OUTPUT"
          elif [ "$S3DRIVE_NATIVE_PROFILE_TOOL" = callgrind ] && [ -f "$S3DRIVE_NATIVE_PROFILE_OUTPUT" ]; then
            callgrind_annotate --auto=no --inclusive=no --threshold=99 "$S3DRIVE_NATIVE_PROFILE_OUTPUT" > "$RUNNER_TEMP/native-cpu-profile/exclusive.txt"
            callgrind_annotate --auto=no --inclusive=yes --tree=both --threshold=99 "$S3DRIVE_NATIVE_PROFILE_OUTPUT" > "$RUNNER_TEMP/native-cpu-profile/inclusive.txt"
            echo "Exclusive instruction costs (not elapsed time):"
            head -n 160 "$RUNNER_TEMP/native-cpu-profile/exclusive.txt"
            echo "Inclusive instruction costs and call counts (not elapsed time):"
            head -n 260 "$RUNNER_TEMP/native-cpu-profile/inclusive.txt"
            # Pure identity work is a separate attribution question. Keep all
            # symbols in this private report, but emit only the bounded family.
            callgrind_annotate --auto=no --inclusive=yes --tree=both --threshold=100 "$S3DRIVE_NATIVE_PROFILE_OUTPUT" > "$RUNNER_TEMP/native-cpu-profile/identities.txt"
            echo "Pure preparation identity derivations (inclusive instruction events):"
            if grep -E 'preparation::model::(Info|Input).*::id|preparation::ledger::Saved.*::info' "$RUNNER_TEMP/native-cpu-profile/identities.txt" > "$RUNNER_TEMP/native-cpu-profile/identity-family.txt"; then
              head -n 120 "$RUNNER_TEMP/native-cpu-profile/identity-family.txt"
            else
              echo "No matching identity symbols; attribution unavailable, not zero cost."
            fi
            echo "Complete bounded direct-callee sections for intrinsic representation work:"
            python - "$RUNNER_TEMP/native-cpu-profile/identities.txt" <<'PYREPORT'
          import pathlib, re, sys
          report = pathlib.Path(sys.argv[1]).read_text()
          selected = re.compile(r"retention::(?:Anchor|native::Terminal).*::validate_in|preparation::model::(?:Input|Info).*::(?:validate|id)|publication::model::(?:Input|Record).*::(?:validate|matches|reservation)|sparse_views::model::Record.*::child|transfers::object_operation")
          blocks = []
          for block in re.split(r"\n[ \t]*\n", report):
              if any(re.search(r"\s\*\s", line) and selected.search(line) for line in block.splitlines()):
                  blocks.append(block)
          if not blocks:
              print("No matching direct-callee sections; attribution unavailable, not zero cost.")
          for index, block in enumerate(blocks[:12]):
              lines = block.splitlines()
              print(f"Section {index + 1}: inclusive costs overlap and must not be summed across callers.")
              print("\n".join(lines[:120]))
              if len(lines) > 120:
                  print(f"Section truncated: {len(lines) - 120} additional lines omitted.")
          if len(blocks) > 12:
              print(f"Additional matching sections omitted: {len(blocks) - 12}.")
          PYREPORT
            echo "Targeted validation/serialization/SQL families (inclusive report):"
            grep -E 'retention|Terminal|Anchor|serde|sha2|checked_flushes|read_data|rusqlite|sqlite|preparation.*ledger|sparse_views.*ledger' "$RUNNER_TEMP/native-cpu-profile/inclusive.txt" | awk 'NR <= 200' || true
          else
            echo "No usable profile was produced; no CPU attribution is established."
          fi
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify native fixture schema expectations
        run: python3 scripts/check-schema-fixtures.py
      - name: Verify installer packaging safety
        run: python3 scripts/test-installer-packaging.py
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.4 --locked
      - run: python3 scripts/check-doc-links.py
      - run: mdbook build docs
      - run: mdbook test docs

  extended-retention-soak:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}-
            rust-${{ runner.os }}-1.99.1-
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install pinned WinFsp on disposable hosted VM
        if: runner.os == 'Windows'
        run: ./scripts/install-winfsp.ps1
      - name: Prepare Linux FUSE acceptance
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo modprobe fuse
          test -c /dev/fuse
      - name: Build exact release extended fixture separately from workload deadlines
        timeout-minutes: 25
        run: cargo test -p s3drive-cli --test chunk_publication --release --locked --no-run
      - name: Verify private developer package creation and relocated CLI startup
        shell: bash
        run: |
          python scripts/test-package-test.py
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/s3drive-package-dependencies.json"
          binary=target/release/s3drive
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          target=$(rustc --version --verbose | sed -n 's/^host: //p' | tr -d '\r')
          python scripts/package-test.py --binary "$binary" --output "$RUNNER_TEMP/s3drive-private-test.zip" --target "$target" --dependencies "$RUNNER_TEMP/s3drive-package-dependencies.json"
          python scripts/package-test.py --verify "$RUNNER_TEMP/s3drive-private-test.zip"
          # Deliberately do not upload a private developer bundle as a public artifact.
      - name: Verify repeatable private packages and relocated durable startup
        shell: bash
        run: |
          binary=target/release/s3drive
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          target=$(rustc --version --verbose | sed -n 's/^host: //p' | tr -d '\r')
          python scripts/test-package-native.py --binary "$binary" --dependencies "$RUNNER_TEMP/s3drive-package-dependencies.json" --target "$target" --output-root "$RUNNER_TEMP/s3drive-repeat-package"
      - name: Verify genuine Git application saves through relocated mounted CLI and interrupted owner
        timeout-minutes: 5
        run: cargo test -p s3drive-cli --test chunk_publication --release hosted_application_git_save_replace_rename_delete_and_interrupted_cold_remount --locked -- --exact --ignored --nocapture --test-threads=1
      - name: Verify relocated Linux shipped startup survives terminal exit
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          sudo apt-get install -y tmux libglib2.0-bin
          python3 scripts/test-linux-session.py "$S3DRIVE_TEST_PACKAGED_CLI"
      - name: Verify relocated Windows shipped startup across independent logons
        if: runner.os == 'Windows'
        timeout-minutes: 15
        env:
          # Same disposable-profile cleanup policy as the original native gate.
          # Functional/security checks and all other cleanup remain mandatory.
          S3DRIVE_DISPOSABLE_WINDOWS_VM: '1'
        run: cargo test -p s3drive-cli --test windows_mount --release --locked -- --ignored --nocapture --test-threads=1
      - name: Additional component 100 lifecycle cycles with dirty readers and 50 mounts
        timeout-minutes: 45
        run: cargo test -p s3drive-cli --test chunk_publication --release component_retention_extended_100_lifecycle_cycles_50_mounts --locked -- --exact --ignored --nocapture --test-threads=1
      - name: Repeat component stress with live external observers and cold integrity checks
        timeout-minutes: 45
        shell: bash
        run: |
          for repeat in 1 2 3; do
            echo "COMPONENT_REPEAT_RUN=$repeat"
            cargo test -p s3drive-cli --test chunk_publication --release component_retention_extended_100_lifecycle_cycles_50_mounts --locked -- --exact --ignored --nocapture --test-threads=1
          done
      - name: Additional actual 1000-save and 100-remount release soak
        timeout-minutes: 45
        run: cargo test -p s3drive-cli --test chunk_publication --release native_retention_extended_1000_saves_100_remounts --locked -- --ignored --exact --nocapture --test-threads=1
      - name: Additional actual four-file 64KiB 300-save release workload
        timeout-minutes: 45
        run: cargo test -p s3drive-cli --test chunk_publication --release native_retention_extended_four_files_64kib_300_saves --locked -- --ignored --exact --nocapture --test-threads=1


  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}-
            rust-${{ runner.os }}-1.99.1-
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install pinned WinFsp SDK on disposable test VM
        run: ./scripts/install-winfsp.ps1
      - name: Build exact locked release CLI and native fixture
        run: cargo test -p s3drive-cli --test chunk_publication --release --locked --no-run
      - name: Install pinned official NuGet WiX builder and UI extension
        run: |
          dotnet tool install wix --version 4.0.6 --tool-path "$env:RUNNER_TEMP/wix-tools"
          if ($LASTEXITCODE -ne 0) { throw 'WiX tool install failed' }
          & "$env:RUNNER_TEMP/wix-tools/wix.exe" extension add --global WixToolset.UI.wixext/4.0.6
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI extension install failed' }
          & "$env:RUNNER_TEMP/wix-tools/wix.exe" extension add --global WixToolset.Util.wixext/4.0.6
          if ($LASTEXITCODE -ne 0) { throw 'WiX rollback fixture extension install failed' }
      - name: Build private current and previous-version fixture installers
        run: |
          python scripts/test-installer-packaging.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable installer tests failed' }
          cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc > "$env:RUNNER_TEMP/installer-dependencies.json"
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency metadata failed' }
          python scripts/build-windows-installer.py --binary target/release/s3drive.exe --dependencies "$env:RUNNER_TEMP/installer-dependencies.json" --wix "$env:RUNNER_TEMP/wix-tools/wix.exe" --output-root "$env:RUNNER_TEMP/installer-current"
          if ($LASTEXITCODE -ne 0) { throw 'Current MSI build failed' }
          python scripts/build-windows-installer.py --binary target/release/s3drive.exe --dependencies "$env:RUNNER_TEMP/installer-dependencies.json" --wix "$env:RUNNER_TEMP/wix-tools/wix.exe" --output-root "$env:RUNNER_TEMP/installer-previous" --test-older-version 0.0.9
          if ($LASTEXITCODE -ne 0) { throw 'Previous-version MSI fixture build failed' }
          python scripts/build-windows-installer.py --binary target/release/s3drive.exe --dependencies "$env:RUNNER_TEMP/installer-dependencies.json" --wix "$env:RUNNER_TEMP/wix-tools/wix.exe" --output-root "$env:RUNNER_TEMP/installer-rollback" --test-rollback
          if ($LASTEXITCODE -ne 0) { throw 'Rollback MSI fixture build failed' }
      - name: Verify real MSI prerequisite upgrade repair downgrade and data-preserving uninstall
        timeout-minutes: 15
        run: ./scripts/test-windows-installer.ps1 -Current "$env:RUNNER_TEMP/installer-current" -Previous "$env:RUNNER_TEMP/installer-previous" -Rollback "$env:RUNNER_TEMP/installer-rollback"
      # No public binary artifact or private validation archive upload.
