name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore Rust build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}-
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - name: Install pinned WinFsp runtime and SDK
        if: runner.os == 'Windows'
        run: ./scripts/install-winfsp.ps1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: Prepare Linux FUSE acceptance
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 tmux libglib2.0-bin
          sudo modprobe fuse
          test -c /dev/fuse
      - name: Verify real Linux mount and teardown
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: cargo test -p s3drive-cli --test linux_mount --locked -- --ignored --nocapture
      - name: Verify real Windows drive and teardown
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: cargo test -p s3drive-cli --test windows_mount --locked -- --ignored --nocapture
      - name: Verify Linux startup without systemd
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: python3 scripts/test-linux-session.py
      - name: Save Rust build cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.4 --locked
      - run: python3 scripts/check-doc-links.py
      - run: mdbook build docs
      - run: mdbook test docs
