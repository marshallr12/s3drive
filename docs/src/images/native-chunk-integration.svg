<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="770" viewBox="0 0 1360 770"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#49637b" stroke-width="1.4"/></marker></defs><rect width="1360" height="770" fill="#f6f8fc"/><g font-family="DejaVu Sans,sans-serif" fill="#172e48"><text x="36" y="46" font-size="27" fill="#172e48" font-weight="bold">Mounted managed files: current writer and proposed chunk bridge</text><text x="36" y="76" font-size="17" fill="#526980">Source review 2026-10-19 • dashed boxes/arrows are proposals • no native chunk-write activation</text><rect x="38" y="122" width="285" height="125" rx="13" fill="#e7effa" stroke="#8fa7bf" stroke-width="2"/><text x="56" y="154" font-size="20" fill="#172e48" font-weight="bold">Applications</text><text x="56" y="182" font-size="16" fill="#172e48">Linux FUSE / Windows WinFsp</text><text x="56" y="208" font-size="16" fill="#172e48">Native handles and callbacks</text><rect x="388" y="122" width="445" height="125" rx="13" fill="#eef1f5" stroke="#8fa7bf" stroke-width="2"/><text x="406" y="154" font-size="20" fill="#172e48" font-weight="bold">Current mounted writer</text><text x="406" y="182" font-size="16" fill="#172e48">Complete file snapshots and staging</text><text x="406" y="208" font-size="16" fill="#172e48">8 MiB write limit; chunk reads are read-only</text><path d="M323,182 L388,182" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="328" width="285" height="174" rx="13" fill="#e8f5ef" stroke="#409273" stroke-width="2" stroke-dasharray="8 5"/><text x="56" y="360" font-size="20" fill="#172e48" font-weight="bold">Proposed Rust bridge</text><text x="56" y="388" font-size="16" fill="#172e48">Ranged edits + shared guards</text><text x="56" y="414" font-size="16" fill="#172e48">Durable local size / head</text><text x="56" y="440" font-size="16" fill="#172e48">Existing handle rules retained</text><path d="M180,247 L180,328" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="388" y="318" width="445" height="190" rx="13" fill="#fff6e7" stroke="#c19143" stroke-width="2" stroke-dasharray="8 5"/><text x="406" y="350" font-size="20" fill="#172e48" font-weight="bold">Local SQLite: design boundary</text><text x="406" y="378" font-size="16" fill="#172e48">Sparse source views and read pins</text><text x="406" y="404" font-size="16" fill="#172e48">Namespace / open-handle ledgers</text><text x="406" y="430" font-size="16" fill="#172e48">Validated composition still required</text><text x="406" y="456" font-size="16" fill="#172e48">One SQL owner preferred; no network in Tx</text><path d="M323,412 L388,412" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="388" y="572" width="445" height="115" rx="13" fill="#e7effa" stroke="#8fa7bf" stroke-width="2"/><text x="406" y="604" font-size="20" fill="#172e48" font-weight="bold">Rust S3 client</text><text x="406" y="632" font-size="16" fill="#172e48">Immutable chunk / manifest transfers</text><text x="406" y="658" font-size="16" fill="#172e48">Upload completion is not a file flush</text><path d="M610,508 L610,572" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="930" y="122" width="390" height="125" rx="13" fill="#e7effa" stroke="#8fa7bf" stroke-width="2"/><text x="948" y="154" font-size="20" fill="#172e48" font-weight="bold">Shared Rust coordinator</text><text x="948" y="182" font-size="16" fill="#172e48">Namespace and exact root CAS</text><text x="948" y="208" font-size="16" fill="#172e48">May run locally or remotely</text><rect x="930" y="302" width="390" height="112" rx="13" fill="#ffffff" stroke="#8fa7bf" stroke-width="2"/><text x="948" y="334" font-size="20" fill="#172e48" font-weight="bold">Authority SQLite</text><text x="948" y="362" font-size="16" fill="#172e48">Shared metadata; separate from</text><text x="948" y="388" font-size="16" fill="#172e48">every client’s private cache / journal</text><path d="M1125,247 L1125,302" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)"/><rect x="930" y="572" width="390" height="115" rx="13" fill="#e7effa" stroke="#8fa7bf" stroke-width="2"/><text x="948" y="604" font-size="20" fill="#172e48" font-weight="bold">S3-compatible service</text><text x="948" y="632" font-size="16" fill="#172e48">One or more buckets</text><text x="948" y="658" font-size="16" fill="#172e48">Immutable chunks and manifests</text><path d="M833,630 L930,630" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M833,365 L878,365 L878,184 L930,184" fill="none" stroke="#49637b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="848" y="468" font-size="16" fill="#526980">Payloads go directly to S3;</text><text x="848" y="494" font-size="16" fill="#526980">the coordinator commits metadata.</text><text x="38" y="734" font-size="17" fill="#526980">Required before activation: origins • state composition • exact recovery • bounded retention • real driver lifecycle tests</text></g></svg>