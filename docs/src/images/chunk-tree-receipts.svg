<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">Complete historical tree receipt inspection</title>
<desc id="desc">Root and leaf acknowledgments remain but a data grandchild acknowledgment has been deleted. Direct root checks pass; whole-tree receipt inspection fails without settling the original source.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#47617c" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="620" fill="#f4f7fb"/>
<g font-family="sans-serif" fill="#172b42">
<text x="30" y="39" font-size="24" font-weight="bold">Every historical object receipt must match the frozen tree</text>
<text x="30" y="68" font-size="16">Local SQLite inspection • no S3 calls • no logical file acknowledgment</text>
<rect x="30" y="90" width="980" height="60" rx="9" fill="#e8eafa" stroke="#7477a3"/>
<text x="50" y="115" font-size="17">Frozen plan + sealed source snapshot + manifest hash + authenticated page graph</text>
<text x="50" y="138" font-size="15">One synchronous owner command; temporary receipt-forest proof stays inside it</text>
<rect x="375" y="182" width="290" height="73" rx="8" fill="#e8f5ed" stroke="#4d8b65"/>
<text x="395" y="210" font-size="19" font-weight="bold">Root page • receipt retained</text>
<text x="395" y="236" font-size="15">Direct checks see both child pages</text>
<rect x="65" y="310" width="345" height="73" rx="8" fill="#e8f5ed" stroke="#4d8b65"/>
<text x="85" y="338" font-size="19">Leaf page A • receipt retained</text>
<text x="85" y="363" font-size="15">128 planned zero chunks</text>
<rect x="630" y="310" width="345" height="73" rx="8" fill="#e8f5ed" stroke="#4d8b65"/>
<text x="650" y="338" font-size="19">Leaf page B • receipt retained</text>
<text x="650" y="363" font-size="15">One data-child reference</text>
<rect x="65" y="433" width="345" height="66" rx="8" fill="#fff6df" stroke="#a67c28" stroke-dasharray="6 4"/>
<text x="85" y="460" font-size="18">Explicit holes • no S3 objects</text>
<text x="85" y="484" font-size="15">Planned geometry; no fresh media claim</text>
<rect x="630" y="433" width="345" height="66" rx="8" fill="#fdecec" stroke="#ba5555" stroke-width="2"/>
<text x="650" y="460" font-size="18" font-weight="bold">Data grandchild • receipt missing</text>
<text x="650" y="484" font-size="15">Its flush and settlement were removed</text>
<g stroke="#47617c" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M450 255 V279 H238 V308"/><path d="M590 255 V279 H802 V308"/>
<path d="M238 383 V431" stroke-dasharray="6 4"/><path d="M802 383 V431"/>
</g>
<text x="30" y="543" font-size="19" font-weight="bold">Direct root dependencies pass. Complete-tree receipt inspection refuses a report.</text>
<text x="30" y="575" font-size="16">Source data, newer dirty heads and exact upload identities stay retained.</text>
<text x="30" y="600" font-size="16">Historical completion does not prove current local media or current provider availability.</text>
</g></svg>
