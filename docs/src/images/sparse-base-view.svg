<text x="67" y="495" font-size="15" font-weight="bold">Verified reader + S3 client</text><text x="67" y="521" font-size="13">Reauthorize exact base; verify bytes</text>
<text x="374" y="495" font-size="15" font-weight="bold">Rust authority + SQLite</text><text x="374" y="521" font-size="13">Historical metadata; guarded CAS</text>
<text x="682" y="495" font-size="15" font-weight="bold">S3-compatible buckets</text><text x="682" y="521" font-size="13">Immutable roots, pages and chunks</text>
<text x="35" y="605" font-size="13">A decoded descriptor or stored view is intent, not authorization to read content, upload or settle an edit.</text>
