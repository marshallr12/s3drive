<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">W2b1 local SQLite base-view admission</title>
<desc id="desc">A Rust client uses the existing private SQLite worker. One transaction stores a role marker, immutable target and base identity, an initial base and zero extent view, and an operation key with exact request and result. It returns metadata range plans only. Later composition connects to the verified manifest reader, Rust metadata authority and S3-compatible buckets; W2b1 makes no provider requests and does not activate native writes.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315f85"/></marker></defs>
<rect width="1000" height="620" fill="#f3f7fb"/>
<g font-family="DejaVu Sans, sans-serif" fill="#17344d">
<text x="35" y="42" font-size="25" font-weight="bold">Local base-view admission</text>
<text x="35" y="69" font-size="14">W2b1 draft • exact local intent and immutable metadata • full/platform acceptance pending</text>
<rect x="35" y="103" width="265" height="223" rx="12" fill="#e4eff9" stroke="#527ca0" stroke-width="2"/>
<text x="52" y="135" font-size="16" font-weight="bold">Rust client / state worker</text>
<text x="52" y="167" font-size="14">begin(operation, binding, size)</text>
<text x="52" y="194" font-size="14">88-byte base identity</text>
<text x="52" y="221" font-size="14">Private directory + one owner</text>
<text x="52" y="248" font-size="14">Bounded existing worker queue</text>
<text x="52" y="290" font-size="14" font-weight="bold">Returns metadata range plans</text>
<rect x="415" y="103" width="550" height="252" rx="12" fill="#e6f3ec" stroke="#41795c" stroke-width="2"/>
<text x="433" y="135" font-size="19" font-weight="bold">Local SQLite • schema 29 • outside mount</text>
