<rect x="697" y="246" width="250" height="89" rx="6" fill="white"/>
<text x="446" y="177" font-size="15" font-weight="bold">Role</text><text x="446" y="202" font-size="13">Reciprocal isolation marker</text><text x="446" y="221" font-size="13">No authority / legacy adoption</text>
<text x="710" y="177" font-size="15" font-weight="bold">Files</text><text x="710" y="202" font-size="13">Stable target + original binding</text><text x="710" y="221" font-size="13">Head points at exact local view</text>
<text x="446" y="273" font-size="15" font-weight="bold">Immutable views</text><text x="446" y="298" font-size="13">Base / zero extent metadata</text><text x="446" y="319" font-size="13">64 GiB size, no full-file buffer</text>
<text x="710" y="273" font-size="15" font-weight="bold">Operations</text><text x="710" y="298" font-size="13">Key + exact request + result</text><text x="710" y="319" font-size="13">Same-key replay; no replacement</text>
<path d="M302 174H410" stroke="#315f85" stroke-width="2" marker-end="url(#arrow)"/>
<text x="317" y="153" font-size="13">One atomic</text><text x="317" y="169" font-size="13">transaction</text>
<path d="M411 278H305" stroke="#315f85" stroke-width="2" marker-end="url(#arrow)"/>
<text x="317" y="304" font-size="13">Bounded plan</text>
<text x="35" y="390" font-size="15" font-weight="bold">This phase has no patch writes, remote calls or clean acknowledgment.</text>
<rect x="35" y="422" width="930" height="156" rx="10" fill="#edf0f3" stroke="#7c8993" stroke-width="2" stroke-dasharray="7 5"/>
<text x="52" y="448" font-size="16" font-weight="bold">Later composition and publication phases</text>
