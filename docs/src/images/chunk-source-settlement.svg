<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="610" viewBox="0 0 1050 610" role="img" aria-labelledby="title desc">
<title id="title">Exact chunk source acknowledgment</title>
<desc id="desc">The Rust publisher uploads immutable chunks and manifests through the S3 client and saves the metadata authority receipt. One SQLite owner links those retained proofs to an exact source snapshot. Newer edits remain pending.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#365b78"/></marker></defs>
<rect width="1050" height="610" rx="14" fill="#f6f8fc"/>
<g font-family="DejaVu Sans,sans-serif" fill="#182b46">
<text x="28" y="39" font-size="26" font-weight="bold">A file snapshot and its root object are different identities</text>
<text x="28" y="72" font-size="16" fill="#52647c">Implemented state-library boundary · controller integration and mounted chunks remain pending</text>
<rect x="18" y="102" width="322" height="394" rx="16" fill="#e7f0fb" stroke="#176a9c" stroke-width="2"/>
<text x="35" y="131" font-size="18" font-weight="bold">One private SQLite owner</text>
<rect x="34" y="151" width="290" height="129" rx="10" fill="white"/>
<text x="50" y="180" font-size="18" font-weight="bold">Frozen local state</text>
<text x="50" y="209" font-size="16">Source snapshot 21 + manifest</text>
<text x="50" y="234" font-size="16">Complete chunk tree receipts</text>
<text x="50" y="259" font-size="16">Exact root publication receipt</text>
<rect x="390" y="151" width="270" height="129" rx="10" fill="#e7f3f0" stroke="#11695a" stroke-width="2"/>
<text x="406" y="180" font-size="18" font-weight="bold">Rust S3 publisher</text>
<text x="406" y="209" font-size="16">Upload and verify objects</text>
<text x="406" y="234" font-size="16">Save exact requests / replies</text>
<text x="406" y="259" font-size="16">Recover unknown operations</text>
<rect x="730" y="151" width="292" height="129" rx="10" fill="#e7f3f0" stroke="#11695a" stroke-width="2"/>
<text x="747" y="180" font-size="18" font-weight="bold">S3-compatible service</text>
<text x="747" y="209" font-size="16">Immutable chunks</text>
<text x="747" y="234" font-size="16">Authenticated manifest pages</text>
<text x="747" y="259" font-size="16">Internal names in buckets</text>
<path d="M326 222H388" stroke="#365b78" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M662 222H728" stroke="#365b78" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="332" y="205" font-size="12">journal</text><text x="674" y="205" font-size="12">S3 API</text>
<rect x="390" y="350" width="270" height="125" rx="10" fill="#e7f3f0" stroke="#11695a" stroke-width="2"/>
<text x="406" y="380" font-size="18" font-weight="bold">Rust metadata service</text>
<text x="406" y="409" font-size="16">Publish the exact root</text>
<text x="406" y="434" font-size="16">Return a historical receipt</text>
<text x="406" y="459" font-size="16">Shared metadata database</text>
<path d="M525 282V348" stroke="#365b78" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="540" y="319" font-size="13">exact metadata RPC</text>
<rect x="34" y="350" width="290" height="125" rx="10" fill="white"/>
<text x="50" y="380" font-size="18" font-weight="bold">Source acknowledgment</text>
<text x="50" y="409" font-size="16">Snapshot 21 → committed tree</text>
<text x="50" y="434" font-size="16">Separate versioned proof rows</text>
<text x="50" y="459" font-size="16">Check again before commit</text>
<path d="M178 282V348" stroke="#365b78" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="49" y="319" font-size="14">same-owner transaction</text>
<rect x="730" y="350" width="292" height="125" rx="10" fill="#fff3df" stroke="#9a6116" stroke-width="2"/>
<text x="747" y="380" font-size="18" font-weight="bold">Newer local edit</text>
<text x="747" y="409" font-size="16">Snapshot 22 stays pending</text>
<text x="747" y="434" font-size="16">Same private SQLite owner</text>
<text x="747" y="459" font-size="16">Drafts and conflicts stay intact</text>
<text x="28" y="539" font-size="17">An acknowledgment for snapshot 21 does not declare the whole file clean.</text>
<text x="28" y="571" font-size="16" fill="#52647c">Historical receipts do not prove that current local payloads or provider objects are healthy.</text>
</g></svg>
