<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#355671" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="730" fill="#f7f9fc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#243a4c">
<text x="30" y="38" font-size="25" font-weight="bold">Verified creation evidence reaches the same-owner open journal</text>
<text x="30" y="70" font-size="16" fill="#805311">Library metadata bridge; native lifecycle activation and owned-unlinked publication remain future work</text>
<rect x="30" y="105" width="560" height="490" rx="14" fill="#edf3fa" stroke="#356c91" stroke-width="2"/>
<text x="55" y="135" font-size="18" font-weight="bold" fill="#356c91">Rust client + one private local SQLite worker</text>
<rect x="55" y="155" width="510" height="130" rx="10" fill="white" stroke="#356c91" stroke-width="1.5"/>
<text x="75" y="183" font-size="18" font-weight="bold">Creation SDK and durable creation journal</text>
<text x="75" y="215" font-size="15">Original operation / owner / source controls</text>
<text x="75" y="242" font-size="15">Verified staging/upload witness + exact request</text>
<text x="75" y="269" font-size="15">Saved combined payload / original-fence receipt</text>
