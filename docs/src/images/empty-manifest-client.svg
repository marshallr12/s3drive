<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1190" viewBox="0 0 960 1190" role="img" aria-labelledby="title desc"><title id="title">Empty managed-file creation and recovery</title><desc id="desc">A Rust controller persists intent in private SQLite, uploads and verifies one immutable manifest page in S3, then saves and replays an exact metadata request to the shared Rust coordinator. The coordinator commits to its separate SQLite database. Native chunk creation is pending and Turso is optional research.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#49637b" stroke-width="1.5"/></marker></defs><rect width="960" height="1190" fill="#f6f8fc"/><g font-family="DejaVu Sans,sans-serif" fill="#172e48"><text x="35" y="43" font-size="28" fill="#172e48" font-weight="bold">Creating an empty managed file</text><text x="35" y="76" font-size="18" fill="#526980">Rust client • private SQLite • immutable S3 data • shared metadata</text><rect x="35" y="104" width="890" height="66" rx="13" fill="#eef1f5" stroke="#8fa7bf" stroke-width="2" stroke-dasharray="8 5"/><text x="53" y="135" font-size="21" fill="#172e48" font-weight="bold">Linux FUSE / Windows WinFsp create hook — integration pending</text><path d="M215,170 L215,210" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="35" y="210" width="360" height="139" rx="13" fill="#e7effa" stroke="#8fa7bf" stroke-width="2"/><text x="53" y="241" font-size="21" fill="#172e48" font-weight="bold">Rust creation controller</text><text x="53" y="271" font-size="18" fill="#172e48">Bind volume, parent, name, store</text><text x="53" y="298" font-size="18" fill="#172e48">Derive the canonical 64-byte root</text><text x="53" y="325" font-size="18" fill="#172e48">Use the executor’s exact SQL owner</text><rect x="450" y="210" width="475" height="110" rx="13" fill="#eef1f5" stroke="#8fa7bf" stroke-width="2"/><text x="468" y="241" font-size="21" fill="#172e48" font-weight="bold">Local credential profile</text><text x="468" y="271" font-size="18" fill="#172e48">Frozen credentials for the S3 client</text><text x="468" y="298" font-size="18" fill="#172e48">Never sent to the coordinator</text><path d="M690,320 L690,390" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)"/><text x="708" y="360" font-size="16" fill="#526980">local only</text><path d="M215,349 L215,390" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="377" font-size="16" fill="#526980">one SQL owner</text><rect x="35" y="390" width="360" height="350" rx="13" fill="#fff6e7" stroke="#8fa7bf" stroke-width="2"/><text x="53" y="421" font-size="21" fill="#172e48" font-weight="bold">Private local SQLite</text><text x="53" y="451" font-size="18" fill="#172e48">1  Save the exact creation intent</text><text x="53" y="478" font-size="18" fill="#172e48">   Parent, name, store and IDs</text><text x="53" y="505" font-size="18" fill="#172e48">   Stage the canonical root page</text><text x="53" y="532" font-size="18" fill="#172e48">3  Retain verified upload metadata</text><text x="53" y="559" font-size="18" fill="#172e48">4  Save the exact metadata request</text><text x="53" y="586" font-size="18" fill="#172e48">6  Save the historical receipt</text><text x="53" y="613" font-size="18" fill="#172e48"></text><text x="53" y="640" font-size="18" fill="#172e48">Saved proof must match the</text><text x="53" y="667" font-size="18" fill="#172e48">original verified upload metadata.</text><rect x="450" y="390" width="475" height="150" rx="13" fill="#e7effa" stroke="#8fa7bf" stroke-width="2"/><text x="468" y="421" font-size="21" fill="#172e48" font-weight="bold">Rust S3 executor</text><text x="468" y="451" font-size="18" fill="#172e48">2  Conditional create: one PUT claim</text><text x="468" y="478" font-size="18" fill="#172e48">3  HEAD/GET verify bytes and identity</text><text x="468" y="505" font-size="18" fill="#172e48">On uncertainty: observe; never resend.</text><path d="M395,265 L423,265 L423,432 L450,432" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450,495 L395,495" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)"/><text x="402" y="482" font-size="16" fill="#172e48">3</text><path d="M690,540 L690,620" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)"/><text x="708" y="582" font-size="16" fill="#526980">PUT / HEAD / GET</text><rect x="450" y="620" width="475" height="120" rx="13" fill="#e8f5ef" stroke="#8fa7bf" stroke-width="2"/><text x="468" y="651" font-size="21" fill="#172e48" font-weight="bold">S3-compatible service</text><text x="468" y="681" font-size="18" fill="#172e48">Selected bucket: immutable manifest root</text><text x="468" y="708" font-size="18" fill="#172e48">Object: 64 bytes  •  logical file: 0 bytes</text><path d="M215,740 L215,800" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)"/><path d="M245,800 L245,740" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="777" font-size="16" fill="#526980">saved metadata</text><rect x="35" y="800" width="360" height="130" rx="13" fill="#e7effa" stroke="#8fa7bf" stroke-width="2"/><text x="53" y="831" font-size="21" fill="#172e48" font-weight="bold">Metadata commit / recovery</text><text x="53" y="861" font-size="18" fill="#172e48">5  Replay only the saved request</text><text x="53" y="888" font-size="18" fill="#172e48">No S3 credentials or body reads</text><rect x="450" y="800" width="475" height="130" rx="13" fill="#e7effa" stroke="#8fa7bf" stroke-width="2"/><text x="468" y="831" font-size="21" fill="#172e48" font-weight="bold">Shared Rust coordinator</text><text x="468" y="861" font-size="18" fill="#172e48">Local loopback or remote authenticated TLS</text><text x="468" y="888" font-size="18" fill="#172e48">Atomic name + root + history transaction</text><path d="M395,846 L450,846" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)"/><text x="413" y="835" font-size="16" fill="#172e48">5</text><path d="M450,887 L395,887" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)"/><text x="413" y="915" font-size="16" fill="#172e48">6</text><path d="M690,930 L690,980" fill="none" stroke="#49637b" stroke-width="2" marker-end="url(#arrow)"/><rect x="450" y="980" width="475" height="120" rx="13" fill="#fff6e7" stroke="#8fa7bf" stroke-width="2"/><text x="468" y="1011" font-size="21" fill="#172e48" font-weight="bold">Shared authority database</text><text x="468" y="1041" font-size="18" fill="#172e48">SQLite: separate from every client journal</text><text x="468" y="1068" font-size="18" fill="#172e48">Turso: researched, not implemented here</text><text x="35" y="1134" font-size="18" fill="#526980">File bytes go directly to S3; the coordinator commits metadata.</text><text x="35" y="1164" font-size="18" fill="#526980">A creation receipt is historical, not current-path or native-flush proof.</text></g></svg>