<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
<title id="title">Reopen the original manifest base after restart</title>
<desc id="desc">A future local SQLite sparse edit view stores an 88-byte descriptor. The Rust reader authenticates exact retained version metadata with the Rust authority and its SQLite history, then reads the original S3 root with fresh credentials and verifies its revision and hashes. BaseFile exposes content and proofs without invented historical namespace attributes. Original CAS identity is preserved. Sparse edit views and native chunk writes are not activated by this draft.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#415b72"/></marker></defs>
<rect width="1080" height="650" rx="16" fill="#f3f6fa"/>
<g font-family="sans-serif" fill="#17324d">
<text x="32" y="42" font-size="25" font-weight="bold">Reopen an exact base after restart</text>
<text x="32" y="70" font-size="15">Draft reader path • Future sparse edit views keep the original CAS value</text>
<rect x="24" y="96" width="600" height="440" rx="12" fill="white" stroke="#adc0d0"/>
<text x="44" y="125" font-size="19" font-weight="bold">Local workstation: Linux or Windows</text>
<rect x="48" y="149" width="302" height="115" rx="9" fill="#fff4db" stroke="#b99b4f" stroke-dasharray="6 4"/>
<text x="65" y="178" font-size="18" font-weight="bold">Local SQLite edit view</text>
<text x="65" y="202" font-size="15">W2 planned: 88-byte base descriptor</text>
<text x="65" y="226" font-size="15">plus immutable local patches</text>
<text x="65" y="250" font-size="14">Descriptor decoding is untrusted intent</text>
<path d="M176 265V316" fill="none" stroke="#415b72" stroke-width="2" marker-end="url(#arrow)"/>
<text x="194" y="295" font-size="14">reopen_base</text>
<rect x="48" y="319" width="550" height="176" rx="9" fill="#e5efff" stroke="#6790bd"/>
<text x="65" y="349" font-size="18" font-weight="bold">Rust reader + S3 client</text>
<text x="65" y="376" font-size="15">1. Authenticate history; match volume, file and version</text>
<text x="65" y="403" font-size="15">2. HEAD/GET and verify the original root</text>
<text x="65" y="430" font-size="15">3. BaseFile: bytes and proofs, no pathname attributes</text>
<text x="65" y="464" font-size="14">Shared: 4 operations • 256 snapshots • 30 s deadline</text>
<rect x="692" y="133" width="360" height="148" rx="9" fill="#e9f5ed" stroke="#73a88a"/>
<text x="710" y="164" font-size="19" font-weight="bold">Rust authority</text>
<text x="710" y="191" font-size="15">SQLite retained publications</text>
<text x="710" y="218" font-size="15">Exact original payload reference</text>
<text x="710" y="249" font-size="14">Current namespace may have changed</text>
<path d="M598 350H643V211H689" fill="none" stroke="#415b72" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M692 265H663V386H600" fill="none" stroke="#415b72" stroke-width="2" marker-end="url(#arrow)"/>
<text x="631" y="312" font-size="12">TLS*</text>
<rect x="692" y="344" width="360" height="151" rx="9" fill="#f2eafb" stroke="#9a7ab6"/>
<text x="710" y="375" font-size="19" font-weight="bold">S3-compatible storage</text>
<text x="710" y="403" font-size="15">Immutable root, pages and chunks</text>
<text x="710" y="433" font-size="14">Fresh credentials + revision/hash checks</text>
<text x="710" y="467" font-size="14">Reference discovery needs no data GET</text>
<path d="M598 418H689" fill="none" stroke="#415b72" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608" y="408" font-size="12">HEAD/GET</text>
<text x="32" y="553" font-size="13">* Production history transport uses TLS; owned loopback contract fixtures use HTTP.</text>
<rect x="24" y="570" width="1028" height="62" rx="9" fill="#fff4db" stroke="#b99b4f"/>
<text x="43" y="596" font-size="18" font-weight="bold">Dirty view keeps its original CAS expected value</text>
<text x="43" y="620" font-size="14">History proves version identity, not an upload receipt. Missing, denied or changed objects return errors.</text>
</g></svg>
