<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Empty manifest creation boundaries</title><desc id="desc">A planned Rust client uploads a canonical empty root to S3 before sending metadata to the implemented Rust authority. SQLite commits the namespace entry, manifest history and exact operation result atomically. Provider and native creation integration remain pending.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#496477"/></marker></defs><rect width="1400" height="760" fill="#f5f8fb"/><text x="48" y="48" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#173349" font-weight="bold">Empty file, real manifest</text><text x="48" y="80" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#173349" font-weight="normal">Proposed client flow; metadata transaction implemented in the isolated candidate</text><rect x="48" y="142" width="365" height="205" rx="14" fill="#fff" stroke="#718797" stroke-width="2" stroke-dasharray="8 5"/><text x="70" y="176" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#173349" font-weight="bold">Local Rust client</text><text x="70" y="211" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">Durable create / upload intent</text><text x="70" y="238" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">S3 credentials and write policy</text><text x="70" y="265" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">64-byte root; 0-byte file</text><text x="70" y="292" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">PUT + verify root and revision</text><text x="70" y="319" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">Publisher integration still required</text><rect x="500" y="142" width="360" height="205" rx="14" fill="#fff" stroke="#718797" stroke-width="2" stroke-dasharray="8 5"/><text x="522" y="176" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#173349" font-weight="bold">S3-compatible service</text><text x="522" y="211" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">Store the real manifest object</text><text x="522" y="238" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">Return ETag / version and bytes</text><text x="522" y="265" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">Honor conditional object creation</text><text x="522" y="292" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">No provider requests in this phase</text><rect x="48" y="440" width="365" height="166" rx="14" fill="#fff" stroke="#718797" stroke-width="2" stroke-dasharray="8 5"/><text x="70" y="474" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#173349" font-weight="bold">Local file state</text><text x="70" y="509" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">Accept exact metadata receipt</text><text x="70" y="536" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">Initialize normal manifest edit view</text><text x="70" y="563" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">Native / recovery bridge pending</text><rect x="918" y="142" width="420" height="205" rx="14" fill="#e7f5ef" stroke="#17806a" stroke-width="2" /><text x="940" y="176" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#173349" font-weight="bold">Rust metadata authority</text><text x="940" y="211" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">CreateEmptyManifest request</text><text x="940" y="238" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">Derive canonical root / key itself</text><text x="940" y="265" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">Check name, parent and store</text><text x="940" y="292" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">No S3 credentials on this service</text><rect x="918" y="440" width="420" height="166" rx="14" fill="#e7f5ef" stroke="#17806a" stroke-width="2" /><text x="940" y="474" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#173349" font-weight="bold">SQLite: one transaction</text><text x="940" y="509" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">File node + manifest history</text><text x="940" y="536" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">Namespace sequence + exact result</text><text x="940" y="563" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">All commit together or roll back</text><polyline points="413,215 500,215" fill="none" stroke="#496477" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="433" y="194" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#173349" font-weight="normal">PUT</text><polyline points="230,347 230,387 875,387 875,245 918,245" fill="none" stroke="#496477" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="420" y="413" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#173349" font-weight="normal">after client verification: submit exact metadata request</text><polyline points="1128,347 1128,440" fill="none" stroke="#496477" stroke-width="2.5" marker-end="url(#arrow)" /><text x="1143" y="397" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#173349" font-weight="normal">atomic metadata commit</text><polyline points="918,300 900,300 900,526 413,526" fill="none" stroke="#496477" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="512" y="507" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#173349" font-weight="normal">exact receipt / historical recovery</text><rect x="48" y="650" width="1290" height="66" rx="10" fill="#fff4d9" stroke="#d7b45c"/><text x="68" y="678" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#173349" font-weight="normal">Solid green: implemented candidate. Dashed: client/provider/native integration still planned.</text><text x="68" y="704" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#173349" font-weight="normal">No invented manifest identity. No claim of provider upload, mounted creation, or acceptance before full gates.</text><polyline points="500,275 413,275" fill="none" stroke="#496477" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="415" y="299" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#173349">HEAD/GET</text></svg>