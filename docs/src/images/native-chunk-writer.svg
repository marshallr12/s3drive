<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#355671" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="700" fill="#f7f9fc"/>
<text x="35" y="40" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#243a4c">Native chunk writer: data and metadata take separate paths</text>
<text x="35" y="70" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#805311">Experimental version 8 · native fixtures verified · provider and physical startup acceptance pending</text>
<rect x="35" y="115" width="265" height="145" rx="12" fill="white" stroke="#356c91" stroke-width="2"/>
<text x="53" y="147" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#356c91">FUSE + WinFsp</text>
<text x="53" y="179" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">Linux and Windows file I/O</text>
<text x="53" y="205" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">Sparse writes beyond 8 MiB</text>
<text x="53" y="231" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">One exact view per flush</text>
<rect x="355" y="115" width="395" height="145" rx="12" fill="white" stroke="#356c91" stroke-width="2"/>
<text x="373" y="147" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#356c91">Local Rust chunk writer</text>
<text x="373" y="179" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">Canonical create + guarded reader</text>
<text x="373" y="205" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">4 owned Tokio tasks + stable retry IDs</text>
<text x="373" y="231" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">Policy-bound S3 + metadata clients</text>
<rect x="850" y="115" width="315" height="175" rx="12" fill="white" stroke="#655b99" stroke-width="2"/>
<text x="868" y="147" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#655b99">Shared Rust authority</text>
<text x="868" y="179" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">Names, directories and root CAS</text>
<text x="868" y="205" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">Metadata SQLite; Turso proposed</text>
<text x="868" y="231" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">HTTPS + private bearer token</text>
<text x="868" y="257" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">Hosting location remains open</text>
<rect x="850" y="380" width="315" height="155" rx="12" fill="white" stroke="#2d7b6d" stroke-width="2"/>
<text x="868" y="412" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#2d7b6d">S3-compatible service</text>
<text x="868" y="444" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">One or more configured buckets</text>
<text x="868" y="470" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">Immutable data chunks + manifests</text>
<text x="868" y="496" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">Direct transfers from Rust client</text>
<rect x="355" y="335" width="395" height="170" rx="12" fill="white" stroke="#486c50" stroke-width="2"/>
<text x="373" y="367" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#486c50">Private local SQLite</text>
<text x="373" y="399" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">Sparse views, staged objects, retry state</text>
<text x="373" y="425" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">Permanent volume/source/owner binding</text>
<text x="373" y="451" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">Separate remote commit and local ACK</text>
<text x="373" y="477" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">Outside the mounted tree; no GC yet</text>
<rect x="35" y="350" width="265" height="130" rx="12" fill="white" stroke="#805311" stroke-width="2"/>
<text x="53" y="382" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#805311">Private credentials</text>
<text x="53" y="414" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">AWS profile + authority token</text>
<text x="53" y="440" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">Outside Git and mounted tree</text>
<text x="53" y="466" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#243a4c">No S3 credentials at authority</text>
