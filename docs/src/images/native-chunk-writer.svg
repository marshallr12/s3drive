<text x="803" y="320" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#243a4c">Data</text>
<path d="M545 260 V330" fill="none" stroke="#355671" stroke-width="2" marker-end="url(#arrow)"/>
<text x="557" y="304" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#243a4c">Durable state</text>
<path d="M300 400 H325 V220 H350" fill="none" stroke="#355671" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="575" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" fill="#243a4c">Flush order</text>
<text x="35" y="605" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#243a4c">Capture view  →  persist plan  →  create-only S3 PUTs  →  metadata CAS  →  exact local acknowledgment</text>
<text x="35" y="642" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#805311">Remaining work: directory creation, rename/delete and deferred/open-unlinked publication.</text>
<text x="35" y="671" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#536577">Existing-only creation recovery and normal-owner root recovery do not imply cold namespace/open recovery.</text>
