<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Draft local acknowledgment and clean base epochs</title>
<desc id="desc">S3 holds immutable chunks and manifests. The Rust authority stores the published root in SQLite. After publication, the local SQLite owner can atomically replace the exact published head with a view of that new base. A newer local head is never replaced. Old views and bytes remain retained; reclamation and native activation are later gates.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#43657d"/></marker></defs>
<rect width="1120" height="650" fill="#f4f7fb"/>
<g font-family="sans-serif" fill="#172f43">
<text x="32" y="40" font-size="25" font-weight="bold">Acknowledging an exact published view</text>
<text x="32" y="68" font-size="16">W5b1 library draft · 2026-10-19 · reclamation and mounted chunk writes remain separate</text>
<rect x="24" y="96" width="692" height="430" rx="14" fill="#fff" stroke="#b6c6d4"/>
<text x="44" y="127" font-size="19" font-weight="bold">Rust filesystem worker · private local SQLite journal</text>
<rect x="44" y="150" width="296" height="97" rx="9" fill="#e9f1ff" stroke="#7696c3"/>
<text x="60" y="179" font-size="18" font-weight="bold">Published local view A</text>
<text x="60" y="205" font-size="16">Old base R0 + patches + zeros</text>
<text x="60" y="229" font-size="16">Exact root R1 is committed</text>
<rect x="375" y="150" width="318" height="97" rx="9" fill="#e5f5f1" stroke="#6b9c92"/>
<text x="391" y="179" font-size="18" font-weight="bold">S3 client and root publisher</text>
<text x="391" y="205" font-size="16">Verify objects, then publish R1</text>
<text x="391" y="229" font-size="16">Retain exact requests and replies</text>
<path d="M341 198 H368" fill="none" stroke="#43657d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="289" width="649" height="92" rx="9" fill="#fff1d8" stroke="#b79557"/>
<text x="60" y="317" font-size="18" font-weight="bold">One local acknowledgment transaction · no network calls</text>
<text x="60" y="343" font-size="16">Head is A: create clean base view C of R1, then change head to C</text>
<text x="60" y="367" font-size="16">Head is newer H: retain acknowledgment of A; keep H and its base</text>
<path d="M534 248 V283" fill="none" stroke="#43657d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="423" width="649" height="79" rx="9" fill="#f3eafa" stroke="#9b7caf"/>
<text x="60" y="450" font-size="18" font-weight="bold">New edits from C read the published base R1</text>
<text x="60" y="477" font-size="16">Old views, bytes and retry identities stay retained in their old epoch</text>
<path d="M369 382 V417" fill="none" stroke="#43657d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="761" y="113" width="332" height="159" rx="12" fill="#e6f3fa" stroke="#729cb5"/>
<text x="780" y="145" font-size="20" font-weight="bold">S3-compatible service</text>
<text x="780" y="176" font-size="16">Immutable chunks and manifests</text>
<text x="780" y="203" font-size="16">Reuse unchanged references</text>
<text x="780" y="243" font-size="16">Fresh reads still require permission</text>
<path d="M694 188 H754" fill="none" stroke="#43657d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="707" y="177" font-size="13">SDK</text>
<rect x="761" y="323" width="332" height="179" rx="12" fill="#e5f5f1" stroke="#6b9c92"/>
<text x="780" y="355" font-size="20" font-weight="bold">Shared Rust authority</text>
<text x="780" y="386" font-size="16">SQLite: current root and history</text>
<text x="780" y="413" font-size="16">Exact content CAS and replay</text>
<text x="780" y="440" font-size="16">No S3 credentials stored here</text>
<text x="780" y="478" font-size="16">Turso remains a separate proposal</text>
<path d="M694 232 H732 V367 H754" fill="none" stroke="#43657d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="707" y="312" font-size="13">RPC</text>
<rect x="24" y="554" width="1069" height="70" rx="11" fill="#fff" stroke="#b6c6d4"/>
<text x="44" y="581" font-size="18" font-weight="bold">Next: explicit pins and retry retirement, then bounded local reclamation</text>
<text x="44" y="607" font-size="16">A recorded clean base is historical evidence, not proof that another machine has made no later edit.</text>
</g></svg>
