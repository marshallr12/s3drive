[package]
name = "s3drive-winfsp"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
native-tests = ["windows/Wdk_Storage_FileSystem", "windows/Wdk_Foundation", "windows/Win32_System_IO"]

[dependencies]
s3drive-core.workspace = true

[target.'cfg(windows)'.dependencies]
s3drive-fs.workspace = true
s3drive-s3.workspace = true
tokio = { workspace = true, features = ["signal"] }
winfsp.workspace = true
windows.workspace = true

[target.'cfg(windows)'.build-dependencies]
winfsp.workspace = true

[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[lints.rust]
# Only native.rs may contain audited Windows FFI. All other modules forbid it.
unsafe_code = "deny"

[lints.clippy]
all = "warn"
