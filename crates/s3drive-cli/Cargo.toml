[package]
name = "s3drive-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "s3drive"
path = "src/main.rs"

[dependencies]
s3drive-authority.workspace = true
getrandom.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
toml.workspace = true
url.workspace = true
clap.workspace = true
s3drive-core.workspace = true
s3drive-fs.workspace = true
s3drive-s3.workspace = true
s3drive-state.workspace = true
s3drive-fuse.workspace = true
s3drive-winfsp.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
aws-lc-rs = { version = "=1.18.2", default-features = false, features = ["alloc", "aws-lc-sys"] }
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
rcgen.workspace = true
tokio-rustls.workspace = true
s3drive-winfsp = { workspace = true, features = ["native-tests"] }
s3drive-managed.workspace = true
axum.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
percent-encoding.workspace = true
tokio = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.build-dependencies]
winfsp.workspace = true

[lints]
workspace = true
